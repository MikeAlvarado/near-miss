name: NearMiss
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  NearMissCore:
    path: NearMissCore
targets:
  NearMiss:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NearMissCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mikealvarado.nearmiss
        PRODUCT_NAME: NearMiss
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Near Miss
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        UILaunchScreen:
          UIColorName: LaunchBackground
        LSApplicationCategoryType: public.app-category.lifestyle
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryUsageDescription: >-
          Near Miss reads only the date and location of your photos to find
          where you and your partner almost crossed paths. Photos are never
          opened or copied, and nothing leaves your iPhone.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.mikealvarado.nearmiss.trail
            UTTypeDescription: Near Miss trail
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - nearmiss
        CFBundleDocumentTypes:
          - CFBundleTypeName: Near Miss trail
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.github.mikealvarado.nearmiss.trail
